name: Autonomous Agents (24/7)

# GitHub の「毎時」cron は実際には1日5〜7回・不定時刻でしか起動しない。
# 各社員は scripts/agents/lib_gate.sh の daily_gate で「担当時刻以降の最初の起動で1日1回（または週1回）」実行する。
# ファネル監視（funnel）だけはAIを使わないので起動のたびに実行する。
#
# 2026-09-17 体制変更（収益化に集中）:
#   停止: Google広告最適化（広告停止中・API未連携）、カスタマーサクセス（顧客0）
#   統合: CEO・PM・競合・広報・UX・エンジニア・アナリスト → 週次経営レポート（weekly_exec）
#   週1回化: 法務（水曜）
#   新設: 無料診断ファネル監視（funnel）
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      agent:
        description: '手動実行する社員（カンマ区切り。例: weekly_exec,secretary / all で全員）。担当時刻に関係なく実行されます'
        required: false
        default: 'all'

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # 稼働ログ（LIVEダッシュボード・日報・ゲート判定で使用）
  AGENT_SUPABASE_URL: ${{ secrets.AGENT_SUPABASE_URL }}
  AGENT_SUPABASE_ANON_KEY: ${{ secrets.AGENT_SUPABASE_ANON_KEY }}
  AGENT_LOG_TOKEN: ${{ secrets.AGENT_LOG_TOKEN }}

jobs:

  funnel-agent:
    name: 無料診断ファネル監視
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent == 'all' || contains(format(',{0},', inputs.agent), ',funnel,') }}
    steps:
      - uses: actions/checkout@v4
      - name: ファネル監視（AI不使用）
        id: run
        run: bash scripts/agents/run.sh funnel scripts/agents/funnel.sh

  weekly-exec-agent:
    name: 週次経営レポート（CEO室）
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent == 'all' || contains(format(',{0},', inputs.agent), ',weekly_exec,') }}
    steps:
      - uses: actions/checkout@v4
      - name: 週次経営レポート実行
        id: run
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: bash scripts/agents/run.sh weekly_exec scripts/agents/weekly_exec.sh

  marketing-agent:
    name: マーケティング担当
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent == 'all' || contains(format(',{0},', inputs.agent), ',marketing,') }}
    steps:
      - uses: actions/checkout@v4
      - name: マーケティングエージェント実行
        id: run
        run: bash scripts/agents/run.sh marketing scripts/agents/marketing.sh

  seo-agent:
    name: SEO・GEOスペシャリスト
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent == 'all' || contains(format(',{0},', inputs.agent), ',seo,') }}
    steps:
      - uses: actions/checkout@v4
      - name: SEO・GEOエージェント実行
        id: run
        run: bash scripts/agents/run.sh seo scripts/agents/seo.sh

  sales-agent:
    name: 営業担当
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent == 'all' || contains(format(',{0},', inputs.agent), ',sales,') }}
    steps:
      - uses: actions/checkout@v4
      - name: 営業エージェント実行
        id: run
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: bash scripts/agents/run.sh sales scripts/agents/sales.sh

  sales-webform-agent:
    name: 営業担当（Webフォーム経由）
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent == 'all' || contains(format(',{0},', inputs.agent), ',sales_webform,') }}
    steps:
      - uses: actions/checkout@v4
      - name: Webフォーム営業リード生成エージェント実行
        id: run
        run: bash scripts/agents/run.sh sales_webform scripts/agents/sales_webform.sh

  finance-agent:
    name: 財務・経理（CFO補佐）
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent == 'all' || contains(format(',{0},', inputs.agent), ',finance,') }}
    steps:
      - uses: actions/checkout@v4
      - name: 財務エージェント実行
        id: run
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: bash scripts/agents/run.sh finance scripts/agents/finance.sh

  legal-agent:
    name: 法務アドバイザー（週1回）
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent == 'all' || contains(format(',{0},', inputs.agent), ',legal,') }}
    steps:
      - uses: actions/checkout@v4
      - name: 法務エージェント実行
        id: run
        run: bash scripts/agents/run.sh legal scripts/agents/legal.sh

  secretary-agent:
    name: 専属秘書・進行管理
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent == 'all' || contains(format(',{0},', inputs.agent), ',secretary,') }}
    steps:
      - uses: actions/checkout@v4
      - name: 秘書エージェント実行（稼働ログから日報を作成）
        id: run
        run: bash scripts/agents/run.sh secretary scripts/agents/secretary.sh
