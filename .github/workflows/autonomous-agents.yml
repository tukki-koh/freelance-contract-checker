name: Autonomous Agents (24/7)

on:
  schedule:
    - cron: '0 * * * *'    # 全エージェント: 毎時実行（24時間365日）
  workflow_dispatch:
    inputs:
      agent:
        description: 'engineer / marketing / ceo / legal / ux / sales / seo / cs / analyst / secretary / all'
        required: false
        default: 'all'

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  engineer-agent:
    name: シニアWebエンジニア
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - name: Vercelステータス取得
        id: vercel
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            STATUS=$(curl -s "https://api.vercel.com/v6/deployments?projectId=prj_q7MuyvOd5gJd20ymxmM6tLHhvi8r&limit=1" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | \
              python3 -c "import sys,json; d=json.load(sys.stdin)['deployments'][0]; print(d['state'])" 2>/dev/null || echo "取得失敗")
          else
            STATUS="VERCEL_TOKEN未設定"
          fi
          echo "status=$STATUS" >> $GITHUB_OUTPUT
      - name: エンジニアエージェント実行
        id: run
        env:
          DEPLOY_STATUS: ${{ steps.vercel.outputs.status }}
          ERROR_LOGS: "Sentry未設定"
        run: |
          chmod +x scripts/agents/engineer.sh
          bash scripts/agents/engineer.sh

  marketing-agent:
    name: マーケティング担当
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - name: マーケティングエージェント実行
        id: run
        run: |
          chmod +x scripts/agents/marketing.sh
          bash scripts/agents/marketing.sh

  sales-agent:
    name: 営業担当
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - name: 営業エージェント実行
        id: run
        run: |
          chmod +x scripts/agents/sales.sh
          bash scripts/agents/sales.sh

  ceo-agent:
    name: ワークシールドCEO
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - name: CEOエージェント実行
        id: run
        run: |
          chmod +x scripts/agents/ceo.sh
          bash scripts/agents/ceo.sh

  legal-agent:
    name: 法務アドバイザー
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - name: 法務エージェント実行
        id: run
        run: |
          chmod +x scripts/agents/legal.sh
          bash scripts/agents/legal.sh

  ux-agent:
    name: UXライター兼コンテンツエディター
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - name: UXライターエージェント実行
        id: run
        run: |
          chmod +x scripts/agents/ux-writer.sh
          bash scripts/agents/ux-writer.sh

  seo-agent:
    name: SEO・GEOスペシャリスト
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - name: SEO・GEOエージェント実行
        id: run
        run: |
          chmod +x scripts/agents/seo.sh
          bash scripts/agents/seo.sh

  cs-agent:
    name: カスタマーサクセス担当
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - name: カスタマーサクセスエージェント実行
        id: run
        run: |
          chmod +x scripts/agents/cs.sh
          bash scripts/agents/cs.sh

  analyst-agent:
    name: データアナリスト
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.run.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - name: 依存パッケージインストール
        run: pip install cryptography
      - name: データアナリストエージェント実行
        id: run
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SEARCH_CONSOLE_SITES: ${{ secrets.SEARCH_CONSOLE_SITES }}
        run: |
          chmod +x scripts/agents/analyst.sh
          bash scripts/agents/analyst.sh

  secretary-agent:
    name: 専属秘書・進行管理
    runs-on: ubuntu-latest
    needs: [engineer-agent, marketing-agent, sales-agent, ceo-agent, legal-agent, ux-agent, seo-agent, cs-agent, analyst-agent]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: 秘書エージェント実行（デイリーサマリー）
        env:
          ENGINEER_REPORT: ${{ needs.engineer-agent.outputs.report }}
          MARKETING_REPORT: ${{ needs.marketing-agent.outputs.report }}
          SALES_REPORT: ${{ needs.sales-agent.outputs.report }}
          CEO_REPORT: ${{ needs.ceo-agent.outputs.report }}
          LEGAL_REPORT: ${{ needs.legal-agent.outputs.report }}
          UX_REPORT: ${{ needs.ux-agent.outputs.report }}
          SEO_REPORT: ${{ needs.seo-agent.outputs.report }}
          CS_REPORT: ${{ needs.cs-agent.outputs.report }}
          ANALYST_REPORT: ${{ needs.analyst-agent.outputs.report }}
        run: |
          chmod +x scripts/agents/secretary.sh
          bash scripts/agents/secretary.sh
